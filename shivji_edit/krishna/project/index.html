<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Krishna Status</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Tiro Devanagari Sanskrit";
        src: url("assets/TiroDevanagariSanskrit-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "Cinzel";
        src: url("assets/Cinzel.ttf") format("truetype");
        font-weight: 400 900;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      .full {
        position: absolute;
        inset: 0;
      }

      /* paintings: full-bleed, cover, slow push-in */
      #photos {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .ph {
        position: absolute;
        inset: 0;
        overflow: hidden;
        opacity: 0;
      }
      .ph img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(0.78) contrast(1.12) saturate(1.08);
      }

      /* moody grade */
      #grade {
        background: linear-gradient(180deg, rgba(20, 10, 40, 0.35) 0%, rgba(0, 0, 0, 0) 40%, rgba(60, 20, 0, 0.3) 100%);
        mix-blend-mode: multiply;
      }
      #center-dim {
        background: radial-gradient(ellipse 90% 16% at 50% 50%, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0) 100%);
        opacity: 0;
      }
      #vignette {
        background: radial-gradient(ellipse 85% 70% at 50% 48%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.8) 100%);
      }
      #grain {
        position: absolute;
        inset: -120px;
        background: url("assets/grain.png");
        mix-blend-mode: overlay;
        opacity: 0.1;
      }
      .ember {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff8dc 0%, #ffd27a 35%, rgba(255, 170, 60, 0) 70%);
        opacity: 0;
      }

      /* captions: small centred serif, like the reference */
      .cap {
        position: absolute;
        left: 60px;
        right: 60px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0 14px;
        font-family: "Tiro Devanagari Sanskrit", Georgia, serif;
        font-size: 50px;
        line-height: 1.35;
        color: #fbf6ec;
        text-align: center;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 18px rgba(0, 0, 0, 0.7);
      }
      .cap .w {
        opacity: 0;
      }
      .hi {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Tiro Devanagari Sanskrit", serif;
        font-size: 34px;
        line-height: 1.3;
        color: #f2c661;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95), 0 0 14px rgba(255, 150, 30, 0.45);
        white-space: nowrap;
        opacity: 0;
      }
      #intro-cap {
        top: 900px;
        font-size: 46px;
      }

      /* ending */
      #end-deva {
        position: absolute;
        left: 0;
        right: 0;
        top: 860px;
        text-align: center;
        font-family: "Tiro Devanagari Sanskrit", serif;
        font-size: 104px;
        line-height: 1.25;
        background: linear-gradient(180deg, #fff4c8 0%, #f7c64a 55%, #c4801c 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 4px 6px rgba(20, 6, 0, 0.85)) drop-shadow(0 0 22px rgba(255, 150, 30, 0.6));
        white-space: nowrap;
      }
      #end-note {
        position: absolute;
        left: 0;
        right: 0;
        top: 1500px;
        text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 22px;
        color: #e8dcc4;
        opacity: 0.7;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      }

      /* watermark */
      #wm {
        position: absolute;
        right: 54px;
        top: 150px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "Cinzel", serif;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: #ffecbe;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85), 0 0 12px rgba(255, 150, 30, 0.45);
        opacity: 0;
      }
      #wm .star {
        width: 24px;
        height: 24px;
        filter: drop-shadow(0 0 6px rgba(255, 180, 60, 0.9));
      }
      #black {
        position: absolute;
        inset: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <!-- generated by ../make_index.py from ../photos.json; edit there -->
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="28.57">
      <!-- paintings (public domain / CC0, Wikimedia Commons; see CREDITS.md) -->
      <div id="photos">
        <div class="ph" id="ph1"><img id="img1" src="assets/p01.jpg" alt="Krishna and Radha, Kangra school, watercolor and gold, Tokyo National Museum" data-layout-allow-overflow style="object-position: 60% 30%" /></div>
        <div class="ph" id="ph2"><img id="img2" src="assets/p02.jpg" alt="Radha and Krishna watching a storm" data-layout-allow-overflow style="object-position: 50% 45%" /></div>
        <div class="ph" id="ph3"><img id="img3" src="assets/p03.jpg" alt="Maker unknown, India - Krishna and Radha - Google Art Project" data-layout-allow-overflow style="object-position: 50% 30%" /></div>
        <div class="ph" id="ph4"><img id="img4" src="assets/p04.jpg" alt="Krishna and Radha, National Museum, New Delhi" data-layout-allow-overflow style="object-position: 40% 50%" /></div>
        <div class="ph" id="ph5"><img id="img5" src="assets/p05.jpg" alt="Anonymous - Krishna and Radha Watching Rain Clouds, The Month of Bhadon from Baramasa series - 1973.104 - Cleveland Museum of Art" data-layout-allow-overflow style="object-position: 45% 30%" /></div>
        <div class="ph" id="ph6"><img id="img6" src="assets/p06.jpg" alt="Krishna Arjuna Gita" data-layout-allow-overflow style="object-position: 52% 45%" /></div>
      </div>
      <audio id="score" src="assets/soundtrack.mp3" data-start="0" data-duration="28.57" data-track-index="5" data-volume="1"></audio>

      <!-- grade, embers, vignette, grain -->
      <div id="look" class="clip full" data-start="0" data-duration="28.57" data-track-index="1">
        <div id="grade" class="full"></div>
        <div id="center-dim" class="full"></div>
        <div id="embers" class="full"></div>
        <div id="vignette" class="full"></div>
        <div id="grain"></div>
      </div>

      <!-- watermark -->
      <div id="overlay" class="clip full" data-start="0" data-duration="28.57" data-track-index="2">
        <div id="wm"><span>NIRVANA</span><svg class="star" viewBox="-10 -10 20 20"><path d="M0,-9 C1,-2 2,-1 9,0 C2,1 1,2 0,9 C-1,2 -2,1 -9,0 C-2,-1 -1,-2 0,-9Z" fill="#f7c64a" /></svg><span>NILAY</span></div>
      </div>

      <!-- intro: black quote card -->
      <section id="intro" class="clip full" data-start="0" data-duration="4.61" data-track-index="3">
        <div id="intro-cap" class="cap" style="top: 900px"><span class="w">Life</span><span class="w">में</span><span class="w">जब</span><span class="w">सब</span><span class="w">उलझ</span><span class="w">जाए,</span><span class="w">तो</span><span class="w">बस</span><span class="w">याद</span><span class="w">रखना…</span></div>
      </section>

      <!-- the quote, building word by word -->
      <section id="quote" class="clip full" data-start="4.41" data-duration="14.2" data-track-index="3">
        <div id="cap1" class="cap" style="top: 880px"><span class="w">जो</span><span class="w">हुआ,</span><span class="w">अच्छा</span><span class="w">हुआ,</span></div>
        <div id="cap2" class="cap" style="top: 952px"><span class="w">जो</span><span class="w">हो</span><span class="w">रहा</span><span class="w">है,</span><span class="w">अच्छा</span><span class="w">हो</span><span class="w">रहा</span><span class="w">है,</span></div>
      </section>
      <section id="quote2" class="clip full" data-start="18.41" data-duration="7.2" data-track-index="3">
        <div id="cap3" class="cap" style="top: 900px"><span class="w">जो</span><span class="w">होगा,</span><span class="w">वो</span><span class="w">भी</span><span class="w">अच्छा</span><span class="w">होगा…</span><span class="w">बस</span><span class="w">trust</span><span class="w">रखो</span><span class="w">”</span></div>
      </section>

      <!-- ending -->
      <section id="ending" class="clip full" data-start="25.41" data-duration="3.16" data-track-index="4">
        <div id="end-deva">॥ जय श्री कृष्ण ॥</div>
        <div id="end-note">Paintings via Wikimedia Commons · public domain</div>
      </section>

      <div id="black"></div>
    </div>

    <script>
      // Output times; keep in sync with make_index.py and soundtrack.py
      const DUR = 28.57, IMG0 = 4.41, IMG_LEN = 3.5, END = 25.41, NPH = 6;
      const C1 = 4.41, C2 = 11.41, C3 = 18.41;
      // narration: [start, duration, words] of each spoken line; captions reveal word by word across the line
      const VO = [[0.5, 3.309, 10], [4.91, 2.02, 4], [11.71, 2.508, 8], [18.81, 3.402, 10], [25.91, 1.463, 5]];

      // seeded PRNG (determinism: no Math.random)
      let seed = 1008;
      const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;

      const embers = document.getElementById("embers");
      const EMBERS = [];
      for (let i = 0; i < 26; i++) {
        const el = document.createElement("div");
        el.className = "ember";
        const s = 0.5 + rand() * 1.2;
        el.style.left = (rand() * 1060).toFixed(0) + "px";
        el.style.top = (900 + rand() * 1100).toFixed(0) + "px";
        el.style.width = el.style.height = (7 * s).toFixed(1) + "px";
        embers.appendChild(el);
        EMBERS.push({ el, rise: 300 + rand() * 500, sway: 20 + rand() * 50, peak: 0.3 + rand() * 0.4 });
      }

      const tl = gsap.timeline({ paused: true });

      // fade in / out
      tl.fromTo("#black", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "none" }, 0);
      tl.to("#black", { opacity: 1, duration: 0.9, ease: "none" }, DUR - 0.9);

      // film grain
      for (let t = 0; t < DUR; t += 1 / 15) {
        tl.set("#grain", { x: Math.round(rand() * 200 - 100), y: Math.round(rand() * 200 - 100) }, t);
      }

      // embers drift up once the paintings start
      EMBERS.forEach((p, i) => {
        tl.fromTo(p.el, { y: 0, x: 0 }, { y: -p.rise * 2, x: (i % 2 ? 1 : -1) * p.sway, duration: DUR - IMG0, ease: "none" }, IMG0);
        tl.fromTo(p.el, { opacity: 0 }, { opacity: p.peak, duration: 1.0 }, IMG0 + (i % 5) * 0.15);
        tl.to(p.el, { opacity: p.peak * 0.3, duration: 1.2, yoyo: true, repeat: 7, ease: "sine.inOut" }, IMG0 + 1.2 + (i % 6) * 0.3);
      });

      // word-by-word reveal
      const reveal = (sel, [t0, len, n]) => {
        tl.fromTo(`${sel} .w`, { opacity: 0, y: 8, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, stagger: (len * 0.92) / n, ease: "power2.out" }, t0 - 0.05);
      };

      // intro quote card
      reveal("#intro-cap", VO[0]);
      tl.to("#intro-cap", { opacity: 0, duration: 0.5, ease: "power1.in" }, IMG0 - 0.55);

      // paintings: slow push-in with a gentle drift, long soft dissolves
      for (let k = 0; k < NPH; k++) {
        const t0 = IMG0 + k * IMG_LEN;
        const len = k === NPH - 1 ? DUR - t0 : IMG_LEN;
        const dir = k % 2 ? 1 : -1;
        tl.fromTo(`#ph${k + 1}`, { opacity: 0 }, { opacity: 1, duration: k === 0 ? 1.0 : 0.9, ease: "sine.inOut" }, t0 - 0.45);
        tl.fromTo(`#img${k + 1}`, { scale: 1.04, x: -dir * 14, y: 0 }, { scale: 1.16, x: dir * 14, y: -18, duration: len + 0.9, ease: "none" }, t0 - 0.45);
        if (k > 0) tl.set(`#ph${k}`, { opacity: 0 }, t0 + 0.5);
      }

      // captions
      tl.fromTo("#center-dim", { opacity: 0 }, { opacity: 1, duration: 0.8 }, C1 - 0.2);
      tl.to("#center-dim", { opacity: 0, duration: 0.6 }, END - 0.4);
      reveal("#cap1", VO[1]);
      reveal("#cap2", VO[2]);
      tl.to(["#cap1", "#cap2"], { opacity: 0, duration: 0.5, ease: "power1.in" }, C3 - 0.5);
      reveal("#cap3", VO[3]);
      tl.to("#cap3", { opacity: 0, duration: 0.5, ease: "power1.in" }, END - 0.5);

      // watermark
      tl.fromTo("#wm", { opacity: 0 }, { opacity: 0.8, duration: 0.8 }, 0.5);

      // ending
      tl.to("#photos", { filter: "blur(8px) brightness(0.6)", duration: 0.9, ease: "power2.inOut" }, END - 0.3);
      tl.fromTo("#end-deva", { opacity: 0, scale: 1.08, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.9, ease: "power3.out" }, VO[4][0] - 0.2);
      tl.fromTo("#end-note", { opacity: 0 }, { opacity: 0.7, duration: 0.6 }, END + 0.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
